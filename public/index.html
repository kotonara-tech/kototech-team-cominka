<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>出品 | 古材リレー</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./"><b>古材リレー</b><small>KOZAI RELAY</small></a>
    <nav>
      <a href="./" aria-current="page">出品</a>
      <a href="market.html">マーケット</a>
    </nav>
  </header>

  <main class="narrow">
    <h1>撮影して出品</h1>
    <p class="lead">古民家の廃材を撮影すると、AI が寸法・材質・状態を推定し、重量と参考価格を計算します。</p>

    <section id="capture">
      <div class="panel">
        <div class="step-title"><span class="step-no">1</span><h2>解体現場</h2></div>
        <div class="site-row">
          <select id="site"></select>
          <button class="btn ghost small" type="button" id="site-add-toggle">＋ 追加</button>
        </div>
        <form id="site-form" class="site-form" hidden>
          <label class="field"><span>名称</span><input type="text" id="site-name" maxlength="40" required placeholder="例：高畑町の町家"></label>
          <label class="field"><span>地域（市町村・地区）</span><input type="text" id="site-area" maxlength="40" required placeholder="例：奈良市高畑町"></label>
          <div class="row-2">
            <label class="field"><span>築年（西暦）</span><input type="number" id="site-year" min="1600" step="1" placeholder="例：1925"></label>
            <label class="field"><span>建物の種類</span><input type="text" id="site-kind" maxlength="20" required list="site-kinds" placeholder="町家"></label>
          </div>
          <datalist id="site-kinds"></datalist>
          <label class="check"><input type="checkbox" id="site-year-unknown">築年不明（石綿の判定は 2006 年以前として扱う）</label>
          <div class="settings-actions">
            <button class="btn ghost small" type="button" id="site-cancel">やめる</button>
            <button class="btn small" type="submit">追加する</button>
          </div>
          <div class="error" id="site-error" hidden></div>
        </form>
      </div>

      <div class="panel">
        <div class="step-title"><span class="step-no">2</span><h2>撮影</h2></div>
        <label class="photo-drop" id="drop">
          <input type="file" id="photo" accept="image/*" capture="environment">
          <div id="drop-hint"><div class="icon">📷</div><div>タップして撮影・写真を選ぶ</div><div class="muted">A4 用紙や名刺を一緒に写すと寸法の精度が上がる</div></div>
          <img id="preview" alt="" hidden>
        </label>
        <div style="margin-top:12px">
          <div class="muted" style="margin-bottom:6px">写っている基準物</div>
          <div class="seg" id="reference">
            <label><input type="radio" name="ref" value="a4" checked>A4 用紙</label>
            <label><input type="radio" name="ref" value="card">名刺</label>
            <label><input type="radio" name="ref" value="none">なし</label>
          </div>
        </div>
        <label class="field" style="margin-top:12px">
          <span>メモ（任意）</span>
          <input type="text" id="memo" maxlength="200" placeholder="例：座敷の梁、欅の板、障子、納屋のスレート">
        </label>
        <button class="btn block" id="appraise" disabled>AI で鑑定する</button>
        <div class="loading" id="appraising" hidden style="margin-top:12px"><div class="spinner"></div>鑑定中…</div>
        <div class="error" id="appraise-error" hidden></div>
      </div>
    </section>

    <form id="review" hidden>
      <div class="panel">
        <div class="step-title"><span class="step-no">3</span><h2>確認・修正</h2></div>
        <p class="muted" id="ai-source"></p>

        <label class="field"><span>タイトル</span><input type="text" id="title" maxlength="60" required></label>
        <div class="row-2">
          <label class="field"><span>材質</span><select id="material"></select></label>
          <label class="field"><span>部位</span><input type="text" id="part" maxlength="20" placeholder="梁・柱・床板など"></label>
        </div>
        <div class="chips" id="candidates" style="margin:-4px 0 12px"></div>

        <div class="muted" style="margin-bottom:4px">寸法（mm）</div>
        <div class="row">
          <label class="field"><span>長さ</span><input type="number" id="len" min="1" step="1" required></label>
          <label class="field"><span>幅</span><input type="number" id="wid" min="1" step="1" required></label>
          <label class="field"><span>厚さ</span><input type="number" id="thk" min="1" step="1" required></label>
        </div>
        <p class="muted" id="basis" style="margin:-6px 0 12px"></p>

        <div class="row-2">
          <label class="field"><span>状態</span>
            <select id="condition">
              <option value="good">良</option>
              <option value="fair">並（経年変化あり）</option>
              <option value="poor">難あり</option>
            </select>
          </label>
          <label class="field"><span>実測重量 kg（任意）</span><input type="number" id="measured" min="0" step="0.1" placeholder="秤で測った値"></label>
        </div>
        <div class="chips" id="defects" style="margin:-4px 0 12px"></div>

        <label class="field"><span>説明文</span><textarea id="description" maxlength="1000" required></textarea></label>
        <div class="muted" style="margin-bottom:4px">特徴</div>
        <div class="chips" id="features" style="margin-bottom:12px"></div>
        <div class="muted" style="margin-bottom:4px">用途の例</div>
        <div class="chips" id="ideas"></div>
      </div>

      <div class="panel">
        <div class="step-title"><span class="step-no">4</span><h2>見積</h2></div>
        <div class="est-grid">
          <div class="est"><div class="k">重量</div><div class="v" id="e-weight">-</div><div class="s" id="e-weight-s"></div></div>
          <div class="est"><div class="k">体積</div><div class="v" id="e-volume">-</div><div class="s">寸法から計算</div></div>
          <div class="est"><div class="k">CO2 固定量</div><div class="v" id="e-co2">-</div><div class="s">木材が蓄えている炭素</div></div>
          <div class="est"><div class="k">運搬の目安</div><div class="v" id="e-carry" style="font-size:15px">-</div></div>
        </div>
        <div id="hazard"></div>
        <label class="field" id="survey-field" hidden><span>石綿の分析調査</span>
          <select id="survey">
            <option value="none">未調査</option>
            <option value="not_detected">分析済み・不検出</option>
            <option value="detected">分析済み・検出</option>
          </select>
        </label>
        <label class="field" style="margin-top:12px"><span>販売価格（円）</span>
          <div class="price-row">
            <input type="number" id="price" min="0" step="100" required>
            <button type="button" class="btn ghost small" id="reset-price">参考価格に戻す</button>
          </div>
        </label>
        <p class="muted" id="suggested"></p>
        <button class="btn block" id="submit" type="submit">出品する</button>
        <div class="error" id="submit-error" hidden></div>
        <p class="timer" id="timer" style="text-align:center;margin-top:8px"></p>
      </div>
    </form>

    <section id="done" hidden>
      <div class="panel done">
        <div class="big">出品完了</div>
        <p id="done-time" class="timer"></p>
        <p id="done-prov" class="muted"></p>
        <p style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <a class="btn" id="done-link" href="market.html">マーケットで見る</a>
          <button class="btn ghost" id="again" type="button">続けて出品</button>
        </p>
      </div>
    </section>
  </main>

  <script type="module" src="js/seller.js"></script>
</body>
</html>
