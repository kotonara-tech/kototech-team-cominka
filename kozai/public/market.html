<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マーケット | 古材リレー</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="market.html"><b>古材リレー</b><small>KOZAI RELAY</small></a>
    <nav>
      <a href="./">出品</a>
      <a href="market.html" aria-current="page">マーケット</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>奈良の古民家から、次の作り手へ。</h1>
      <p>解体された町家・農家住宅の梁、床板、建具、瓦。作りたいものを選ぶと、寸法が合う古材だけを表示します。</p>
      <div class="recipes" id="recipes"></div>
    </section>

    <div class="filters">
      <input class="q" type="search" id="q" placeholder="キーワード（欅、梁、ならまち…）">
      <select id="category"><option value="">すべての種類</option></select>
      <select id="minLength">
        <option value="">長さ指定なし</option>
        <option value="900">900mm 以上</option>
        <option value="1800">1,800mm 以上</option>
        <option value="3000">3,000mm 以上</option>
      </select>
    </div>
    <div class="result-meta" id="meta"></div>
    <div class="grid" id="grid"></div>
  </main>

  <dialog id="dialog">
    <button class="close-btn" id="close" aria-label="閉じる">×</button>
    <div id="detail"></div>
  </dialog>

  <script type="module" src="js/market.js"></script>
</body>
</html>
